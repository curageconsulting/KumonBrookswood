<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kumon Brookswood — Parent Booking Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --teal:       #009FE3;
  --teal-dark:  #0077B6;
  --teal-light: #E0F4FD;
  --teal-mid:   #B8E4F9;
  --ink:        #0D1B2A;
  --ink2:       #3A4A5C;
  --ink3:       #7A8C9E;
  --snow:       #FFFFFF;
  --fog:        #F5F8FB;
  --fog2:       #EBF2F8;
  --border:     rgba(0,159,227,0.15);
  --border2:    rgba(0,159,227,0.3);
  --green:      #00B894;
  --green-bg:   #E0F8F4;
  --red:        #D63031;
  --red-bg:     #FDECEA;
  --amber:      #E17055;
  --amber-bg:   #FDF0EC;
  --radius-sm:  6px;
  --radius:     12px;
  --radius-lg:  18px;
  --radius-xl:  24px;
  --shadow-sm:  0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow:     0 4px 16px rgba(0,119,182,0.10), 0 1px 4px rgba(0,0,0,0.06);
  --shadow-lg:  0 8px 32px rgba(0,119,182,0.14), 0 2px 8px rgba(0,0,0,0.08);
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--fog);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.6;
}

/* ── Page shell ── */
.page {
  max-width: 600px;
  margin: 0 auto;
  padding: 0 0 4rem;
}

/* ── Hero header ── */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 0 0 var(--radius-xl) var(--radius-xl);
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow-lg);
}
.hero-img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  object-position: center 40%;
  display: block;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,20,40,0.05) 0%,
    rgba(0,20,40,0.55) 100%
  );
}
.hero-content {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 1.25rem 1.5rem 1.5rem;
  display: flex;
  align-items: flex-end;
  gap: 14px;
}
.hero-logo {
  height: 52px;
  width: auto;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.25));
}
.hero-text h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: #fff;
  line-height: 1.2;
  text-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.hero-text p {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  margin-top: 2px;
}

/* ── Address bar ── */
.address-bar {
  display: flex;
  gap: 20px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  background: var(--snow);
  border-radius: var(--radius);
  margin: 0 1rem 1.5rem;
  padding: 12px 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.address-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--ink2);
  text-decoration: none;
}
.address-item i { color: var(--teal); font-size: 16px; }
.address-item:hover { color: var(--teal); }

/* ── Cards ── */
.card {
  background: var(--snow);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  margin: 0 1rem 1rem;
  box-shadow: var(--shadow);
  animation: fadeUp 0.3s ease both;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}
.card-hd {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: 9px;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--fog2);
}
.card-hd i { font-size: 19px; color: var(--teal); }

/* ── Section label ── */
.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink3);
  margin: 0 1rem 0.5rem;
  padding-left: 4px;
}

/* ── Forms ── */
.field { margin-bottom: 1rem; }
.field:last-of-type { margin-bottom: 0; }
.field label {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink2);
  display: block;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.field input, .field select {
  width: 100%;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  padding: 11px 14px;
  border: 1.5px solid var(--fog2);
  border-radius: var(--radius);
  background: var(--fog);
  color: var(--ink);
  transition: all 0.15s;
  appearance: none;
}
.field input:focus, .field select:focus {
  outline: none;
  border-color: var(--teal);
  background: var(--snow);
  box-shadow: 0 0 0 4px rgba(0,159,227,0.1);
}
.field input::placeholder { color: var(--ink3); }
.field input[readonly] { opacity: 0.55; cursor: default; background: var(--fog2); }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ── Buttons ── */
.btn {
  width: 100%;
  font-family: 'DM Sans', sans-serif;
  padding: 12px 18px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid transparent;
  background: var(--fog);
  color: var(--ink2);
  border-color: var(--fog2);
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}
.btn:hover { background: var(--fog2); border-color: var(--border2); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.btn-primary {
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(0,159,227,0.35);
}
.btn-primary:hover {
  background: linear-gradient(135deg, #00b3ff 0%, var(--teal) 100%);
  box-shadow: 0 6px 20px rgba(0,159,227,0.45);
  border-color: transparent;
}
.btn-danger {
  background: var(--red-bg);
  color: var(--red);
  border-color: rgba(214,48,49,0.2);
}
.btn-danger:hover { background: #fbd7d7; }
.btn-sm { width: auto; padding: 7px 13px; font-size: 12px; border-radius: var(--radius-sm); }
.btn-ghost { background: transparent; border-color: var(--border2); color: var(--teal); }
.btn-ghost:hover { background: var(--teal-light); }

/* ── Tabs ── */
.tab-bar {
  display: flex;
  background: var(--snow);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin: 0 1rem 1rem;
  box-shadow: var(--shadow-sm);
}
.tab {
  flex: 1;
  padding: 11px 6px;
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  color: var(--ink3);
  border-right: 1px solid var(--border);
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.tab:last-child { border-right: none; }
.tab.active {
  background: linear-gradient(135deg, var(--teal-light), #d0edf9);
  color: var(--teal-dark);
  font-weight: 700;
}
.tab i { font-size: 15px; }

/* ── Pills ── */
.pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
}
.pill-teal  { background: var(--teal-light); color: var(--teal-dark); }
.pill-green { background: var(--green-bg);   color: #00796B; }
.pill-red   { background: var(--red-bg);     color: var(--red); }
.pill-ink { background: var(--amber-bg);   color: var(--amber); }
.pill-ink   { background: var(--fog2);       color: var(--ink2); }

/* ── Avatar ── */
.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--teal-light), var(--teal-mid));
  color: var(--teal-dark);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,159,227,0.2);
}

/* ── Rows ── */
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 0;
  border-bottom: 1px solid var(--fog2);
  font-size: 13px;
  gap: 10px;
}
.row:last-child { border-bottom: none; }
.row-label { color: var(--ink3); flex-shrink: 0; }
.row-val { font-weight: 600; color: var(--ink); text-align: right; }

/* ── Student rows ── */
.student-row {
  display: flex;
  align-items: flex-start;
  gap: 13px;
  padding: 14px 0;
  border-bottom: 1px solid var(--fog2);
}
.student-row:last-child { border-bottom: none; }

/* ── Chips ── */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  background: var(--teal-light);
  color: var(--teal-dark);
  padding: 3px 9px;
  border-radius: 20px;
  margin: 2px;
  font-weight: 500;
}

/* ── Slots ── */
.slot-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
  gap: 8px;
  margin: 12px 0;
}
.slot {
  border: 1.5px solid var(--fog2);
  border-radius: var(--radius);
  padding: 11px 8px;
  cursor: pointer;
  text-align: center;
  background: var(--fog);
  transition: all .15s;
}
.slot:hover:not(.full) {
  border-color: var(--teal);
  background: var(--teal-light);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0,159,227,0.15);
}
.slot.sel {
  background: linear-gradient(135deg, var(--teal-light), #d0edf9);
  border: 2px solid var(--teal);
  box-shadow: 0 4px 12px rgba(0,159,227,0.2);
}
.slot.full { opacity: 0.35; cursor: not-allowed; }
.slot-t { font-size: 13px; font-weight: 700; color: var(--ink); }
.slot-a { font-size: 11px; color: var(--ink3); margin-top: 3px; }
.slot.sel .slot-t { color: var(--teal-dark); }
.slot.sel .slot-a { color: var(--teal); }

/* ── Day buttons ── */
.day-btn {
  width: 100%;
  padding: 13px 16px;
  border: 1.5px solid var(--fog2);
  border-radius: var(--radius);
  background: var(--fog);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  transition: all .15s;
}
.day-btn:hover:not(:disabled) {
  border-color: var(--teal);
  background: var(--teal-light);
  transform: translateX(3px);
}
.day-btn.sel {
  background: linear-gradient(135deg, var(--teal-light), #d0edf9);
  border-color: var(--teal);
  color: var(--teal-dark);
  font-weight: 600;
}
.day-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.day-badge { font-size: 12px; color: var(--ink3); background: var(--snow); padding: 3px 9px; border-radius: 20px; border: 1px solid var(--fog2); }
.day-btn.sel .day-badge { background: var(--teal-light); color: var(--teal-dark); border-color: var(--teal-mid); }

/* ── Alerts ── */
.alert {
  padding: 12px 15px;
  border-radius: var(--radius);
  font-size: 13px;
  margin-bottom: 1rem;
  display: flex;
  gap: 9px;
  align-items: flex-start;
  line-height: 1.5;
}
.alert i { margin-top: 1px; flex-shrink: 0; font-size: 16px; }
.alert-info  { background: var(--teal-light);  color: var(--teal-dark);  border: 1px solid var(--teal-mid); }
.alert-warn  { background: var(--amber-bg);     color: var(--amber);      border: 1px solid rgba(225,112,85,0.25); }
.alert-err   { background: var(--red-bg);       color: var(--red);        border: 1px solid rgba(214,48,49,0.2); }
.alert-ok    { background: var(--green-bg);     color: #00796B;           border: 1px solid rgba(0,184,148,0.25); }

/* ── Progress bar ── */
.progress-wrap { height: 5px; background: var(--fog2); border-radius: 3px; margin-bottom: 1.25rem; overflow: hidden; }
.progress-bar  { height: 5px; background: linear-gradient(90deg, var(--teal), var(--teal-dark)); border-radius: 3px; transition: width .4s cubic-bezier(.4,0,.2,1); }
.step-label    { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink3); margin-bottom: 6px; }
.step-label span:first-child { font-weight: 600; color: var(--teal-dark); }

/* ── Dashboard user card ── */
.user-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: linear-gradient(135deg, var(--teal-dark) 0%, #005f8e 100%);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  margin: 0 1rem 1rem;
  box-shadow: 0 8px 24px rgba(0,119,182,0.25);
  color: #fff;
  animation: fadeUp 0.3s ease both;
}
.user-card .avatar {
  background: rgba(255,255,255,0.2);
  color: #fff;
  box-shadow: none;
  border: 2px solid rgba(255,255,255,0.3);
}
.user-card-name { font-size: 16px; font-weight: 700; }
.user-card-email { font-size: 12px; opacity: 0.75; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }

/* ── Stats grid ── */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 1rem 1rem; }
.stat-card {
  background: var(--snow);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem;
  text-align: center;
  box-shadow: var(--shadow-sm);
  animation: fadeUp 0.3s ease both;
}
.stat-num { font-family: 'DM Serif Display', serif; font-size: 32px; color: var(--teal-dark); line-height: 1; }
.stat-label { font-size: 12px; color: var(--ink3); margin-top: 4px; font-weight: 500; }

/* ── Empty state ── */
.empty-state { text-align: center; padding: 3rem 1rem; }
.empty-state .empty-icon {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--teal-light);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1rem;
}
.empty-state .empty-icon i { font-size: 28px; color: var(--teal); }
.empty-state h3 { font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.empty-state p { font-size: 13px; color: var(--ink3); margin-bottom: 1.25rem; }

/* ── Divider ── */
hr { border: none; border-top: 1px solid var(--fog2); margin: 14px 0; }

/* ── Link ── */
.link { color: var(--teal); cursor: pointer; font-size: 13px; font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
.link:hover { color: var(--teal-dark); }

/* ── Misc ── */
.muted { color: var(--ink3); font-size: 13px; line-height: 1.6; }
.mt8  { margin-top: 8px; }
.mt12 { margin-top: 12px; }
.mt16 { margin-top: 16px; }
#msg  { min-height: 0; }

/* ── Admin badge ── */
.admin-card {
  display: flex; align-items: center; gap: 14px;
  background: linear-gradient(135deg, #2d3748, #1a202c);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  margin: 0 1rem 1rem;
  color: #fff;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  animation: fadeUp 0.3s ease both;
}
.admin-card .avatar { background: rgba(255,255,255,0.15); color: #fff; border: 2px solid rgba(255,255,255,0.25); }

/* ── Table ── */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; padding: 8px 10px; color: var(--ink3); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 2px solid var(--fog2); }
.data-table th.center { text-align: center; }
.data-table td { padding: 10px; border-bottom: 1px solid var(--fog2); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--fog); }

/* ── Capacity bar ── */
.cap-bar { height: 4px; background: var(--fog2); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.cap-fill { height: 4px; border-radius: 2px; transition: width .3s; }

@media (max-width: 480px) {
  .g2 { grid-template-columns: 1fr; }
  .tab { font-size: 11px; padding: 10px 4px; }
  .tab i { display: none; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="page">

  <!-- Hero -->
  <div class="hero">
    <img class="hero-img" src="centre.jpg" alt="Kumon Brookswood Centre" onerror="this.style.display='none'" />
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <img class="hero-logo" src="kumon-logo.png" alt="Kumon" onerror="this.style.display='none'" />
      <div class="hero-text">
        <h1>Brookswood Centre</h1>
        <p>Parent booking portal</p>
      </div>
    </div>
  </div>

  <!-- Address -->
  <div class="address-bar">
    <a class="address-item" href="https://maps.google.com/?q=4043+200+St+Langley+BC" target="_blank">
      <i class="ti ti-map-pin"></i>
      <span>4043 200 St, Langley, BC V3A 1K8</span>
    </a>
    <a class="address-item" href="tel:+16042452121">
      <i class="ti ti-phone"></i>
      <span>(604) 245-2121</span>
    </a>
  </div>

  <div id="root"></div>
</div>

<script src="app.js"></script>
</body>
</html>
